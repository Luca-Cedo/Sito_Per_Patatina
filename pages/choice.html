<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasto omaggio! 🍽️</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
    <!-- Background decorativo con cuori fluttuanti -->
    <div class="floating-hearts">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <!-- Container principale -->
    <div class="container">
        <div class="page-content">
            <div class="bonus-message choice-bonus">
                <div class="bonus-emoji">💕</div>
                <h2>Hai vinto 10 minuti di coccole e un piatto offerto! 🍽️</h2>
                <p class="bonus-text">Scegli dove andare e quando festeggiare insieme.</p>

                <form id="choiceForm" class="choice-form">
                    <label for="restaurant">Il tuo ristorante</label>
                    <select id="restaurant" name="restaurant" required>
                        <option value="" selected disabled>Scegli un'opzione</option>
                        <option value="Pizza">🍕 Pizza</option>
                        <option value="Sushi">🍣 Sushi</option>
                        <option value="Kebab">🌮 Kebab</option>
                        <option value="Burger King">🍔 Burger King</option>
                    </select>

                    <label for="date_time">Data e ora</label>
                    <input id="date_time" name="date_time" type="datetime-local" required>

                    <button class="submit-choice" type="button" onclick="handleChoiceSubmit()">Conferma la mia scelta</button>
                </form>

                <div class="loading-dots hidden" id="loadingDots">
                    <span></span><span></span><span></span>
                </div>
                <p class="sending-text hidden" id="sendingText">Sto inviando la tua risposta...</p>
                <p class="email-status hidden" id="emailStatus" role="alert"></p>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="../js/email.js"></script>
</body>
</html>
